spring.application.name=tinkar-service
server.port=8085
grpc.server.port=9095

# gRPC transport security. Disabled by default so existing plaintext deployments
# are unaffected by upgrading; enable per-environment via the environment.
#
#   GRPC_TLS_ENABLED=true
#   GRPC_TLS_CERT_CHAIN=/abs/path/server-cert.pem   (PEM certificate chain)
#   GRPC_TLS_PRIVATE_KEY=/abs/path/server-key.pem   (PEM, PKCS#8, unencrypted)
#
# For local development, scripts/generate-dev-cert.sh produces both files and
# prints the exact exports. Run it directly or via `./mvnw -Pdev-tls ...`.
#
# The certificate must carry a subjectAltName covering every hostname clients
# dial: Java matches SANs only and ignores CN, so a CN-only certificate fails
# the handshake with an error that does not name the cause.
#
# The file: prefix is required, not decorative. These properties are Spring
# Resource values; a bare absolute path resolves as a ServletContext-relative
# resource and fails with "Could not open ServletContext resource". Carrying the
# scheme here lets the environment variables stay plain filesystem paths.
grpc.server.security.enabled=${GRPC_TLS_ENABLED:false}
grpc.server.security.certificateChain=file:${GRPC_TLS_CERT_CHAIN:}
grpc.server.security.privateKey=file:${GRPC_TLS_PRIVATE_KEY:}

# Local, gitignored env file (see .env.example) as an alternative to exporting
# NEXUS_USERNAME/NEXUS_PASSWORD in the shell. Optional: absent in CI/Docker, where real
# environment variables are used instead.
spring.config.import=optional:file:.env[.properties]

# SpringDoc OpenAPI / Swagger UI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Tinkar data path
data.path.parent=data
# data.path.child=solor-us-tinkar.sa
#data.path.child=rockskb
data.path.child=gudid
#data.path.child=new

# Tinkar data controller selection
# Options: "Open SpinedArrayStore" or "Open Rocks KB"
data.controller.name=Open Rocks KB

# Dataset provisioning: set dataset.name to auto-download the latest build of a registered
# dataset from Nexus if data.path.parent/<dataset.name> doesn't already exist locally.
# Overrides data.path.child to match. See DatasetProvisioningEnvironmentPostProcessor.
#
# Pass it as a Spring Boot *program* argument, not a bare -D — a bare -D sets a Maven
# system property that never reaches the forked application JVM:
#
#   ./mvnw spring-boot:run -Dspring-boot.run.arguments="--dataset.name=gudidsubset"
#
# Repository per dataset: dataset.nexus.baseUrl is the default, and any dataset may override
# it with dataset.registry.<name>.baseUrl. Not every dataset is published to the same place —
# gudidsubset is in the public group and needs no credentials, while SOLOR-GUDID is only in
# ike-restricted-snapshots and does. Credentials are sent when present and omitted otherwise,
# so a public dataset works with an empty NEXUS_USERNAME/NEXUS_PASSWORD.
dataset.name=
dataset.nexus.baseUrl=https://nexus.tinkar.org/repository/ike-restricted-snapshots/
dataset.nexus.username=${NEXUS_USERNAME:}
dataset.nexus.password=${NEXUS_PASSWORD:}

# Full GUDID. Restricted: inherits the ike-restricted-snapshots default above and requires
# NEXUS_USERNAME/NEXUS_PASSWORD. Not present in the public group (verified 2026-08-18).
dataset.registry.gudid.groupId=dev.ikm.tinkar.data
dataset.registry.gudid.artifactId=SOLOR-GUDID
dataset.registry.gudid.classifier=reasoned-sa
dataset.registry.gudid.controllerName=Open SpinedArrayStore

# Smaller dataset for fast local iteration. version is pinned (rather than auto-resolved to
# the lexicographically latest <version>) because this artifactId publishes multiple
# same-date variants (e.g. ALL vs subset) that aren't ordered chronologically by name.
dataset.registry.gudidsubset.groupId=dev.ikm.tinkar.data
dataset.registry.gudidsubset.artifactId=gudid
dataset.registry.gudidsubset.version=20250804-subset+1.0.0-SNAPSHOT
dataset.registry.gudidsubset.classifier=reasoned-sa
dataset.registry.gudidsubset.controllerName=Open SpinedArrayStore
# Published to the public group, so this one downloads anonymously — no Nexus credentials
# needed for a local run. Overriding baseUrl here rather than changing the global default
# keeps the restricted dataset above working unchanged.
dataset.registry.gudidsubset.baseUrl=https://nexus.tinkar.org/repository/ike-public/

# File upload limits for changeset import
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# gRPC max message size (for large import/export payloads)
grpc.server.max-inbound-message-size=536870912

# Logging
logging.level.dev.ikm.tinkar=DEBUG
logging.level.ai.ica.tinkar=DEBUG